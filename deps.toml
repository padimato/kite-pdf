# Dépendances natives de Kite PDF, téléchargées depuis leur source officielle.
#
# Elles ne sont pas dans le dépôt git. Pour les installer après un `git clone` :
#     cargo run --release -- --fetch-deps
# Sans elles, l'application les télécharge elle-même au premier lancement.
#
# `sha256` est l'empreinte du fichier installé (après extraction de l'archive), dans la version testée.
# Un fichier d'une autre version est accepté, mais l'application affiche un avertissement.
# Pour passer à une nouvelle version : changer `version`, `url` et `sha256`, puis lancer `cargo test`.

[[dependency]]
name = "Moteur PDF (PDFium)"
version = "chromium/8138"
required = true
url = "https://github.com/bblanchon/pdfium-binaries/releases/download/chromium%2F8138/pdfium-win-x64.tgz"
archive_member = "bin/pdfium.dll"
destination = "pdfium.dll"
sha256 = "71a3e63e6ab8f5746a0fc9de9bc3d0c0dc07eb60990dfd37d9db7fc891821943"

[[dependency]]
name = "Lecture des images : moteur (ONNX Runtime)"
version = "1.28.0"
required = false
url = "https://github.com/microsoft/onnxruntime/releases/download/v1.28.0/onnxruntime-win-x64-1.28.0.zip"
archive_member = "onnxruntime-win-x64-1.28.0/lib/onnxruntime.dll"
destination = "assets/models/onnxruntime.dll"
sha256 = "18370c375f07357fa5874344a9d9ac17e6b6fe1eb18b1dd209d79483b4470257"

