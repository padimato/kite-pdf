[package]
name = "super_pdf_reader"
version = "0.1.0"
edition = "2021"
description = "Lecteur PDF ultra-performant et économe en RAM pour Windows (Style Arc, OCR Hybride, ISO 32000)"

[dependencies]
eframe = { version = "0.31", default-features = false, features = ["glow", "default_fonts"] }
egui = "0.31"
pdfium-render = { version = "0.8", features = ["thread_safe"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
lopdf = "0.34"
rfd = "0.15"
anyhow = "1.0"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
oar-ocr = { version = "0.10.2", default-features = false, features = ["simd"] }
# ONNX Runtime est chargé depuis assets/models/onnxruntime.dll (pas de liaison statique, indépendant de la version de MSVC).
ort = { version = "=2.0.0-rc.13", default-features = false, features = ["load-dynamic"] }

# Le code applicatif reste débogable, mais les dépendances (image, egui, ONNX) sont optimisées même en debug.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
