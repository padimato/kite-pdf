[package]
name = "kite-pdf"
version = "1.0.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/padimato/kite-pdf"
description = "Kite PDF : lecteur PDF rapide et léger pour Windows (OCR, annotations, formulaires)"

[dependencies]
eframe = { version = "0.31", default-features = false, features = ["glow", "default_fonts"] }
egui = "0.31"
pdfium-render = { version = "0.8", features = ["thread_safe"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
lopdf = "0.34"
rfd = "0.15"
anyhow = "1.0"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
oar-ocr = { version = "0.10.2", default-features = false, features = ["simd"] }
# ONNX Runtime est chargé depuis assets/models/onnxruntime.dll (pas de liaison statique, indépendant de la version de MSVC).
ort = { version = "=2.0.0-rc.13", default-features = false, features = ["load-dynamic"] }
# Téléchargement des dépendances natives (deps.toml) depuis leur source officielle.
ureq = "2"
sha2 = "0.10"
zip = { version = "2", default-features = false, features = ["deflate"] }
flate2 = "1"
tar = "0.4"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
# Réponse de GitHub pour la vérification des nouvelles versions.
serde_json = "1"

# Le code applicatif reste débogable, mais les dépendances (image, egui, ONNX) sont optimisées même en debug.
[build-dependencies]
# Icône et informations de version intégrées à l'exécutable Windows.
winresource = "0.1"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
